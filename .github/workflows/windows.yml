name: Windows nativo · validar e publicar
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar a versão somente após todos os testes (inclui migrações legadas)'
        type: boolean
        default: false
      legacy_validation:
        description: 'Testar também Electron 0.1.0 e 0.2.1 (Windows descartável)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: bolha-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Dependências nativas e testes
        run: |
          python -m pip install -r requirements-build.txt
          python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Versão e fixture seguinte
        shell: pwsh
        run: |
          $bolhaVersion = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $bolhaParts = $bolhaVersion.Split('.')
          $bolhaNext = $bolhaParts[0] + '.' + $bolhaParts[1] + '.' + ([int]$bolhaParts[2] + 1)
          "BOLHA_VERSION=$bolhaVersion" >> $env:GITHUB_ENV
          "BOLHA_NEXT_VERSION=$bolhaNext" >> $env:GITHUB_ENV
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$bolhaVersion") { throw 'A tag diverge da versão do código.' }
      - name: Compilar e auditar pacote Python/Qt
        run: python scripts/build_native.py
      - name: Empacotar fixture de atualização sem recompilar o aplicativo
        shell: pwsh
        run: |
          python scripts/build_native.py --version $env:BOLHA_NEXT_VERSION --output validation/update-feed --reuse-bundle "build/$($env:BOLHA_VERSION)/dist/Bolha"
      - name: Instalação, atualização, recuperação e métricas Windows
        timeout-minutes: 9
        shell: pwsh
        run: |
          python scripts/test_windows_native.py --installer "release/Bolha-Setup-$($env:BOLHA_VERSION)-x64.exe" --target-installer "validation/update-feed/Bolha-Setup-$($env:BOLHA_NEXT_VERSION)-x64.exe" --output validation/windows-native
      - name: Atualizar a versão estável anterior pelo instalador novo
        if: github.ref_type == 'tag' || inputs.publish_release
        timeout-minutes: 5
        shell: pwsh
        run: |
          $bolhaPreviousInstaller = @'
          from pathlib import Path
          from bolha import VERSION
          from bolha.installation import compare_versions
          from bolha.updates import Transport, find_release
          transport = Transport()
          previous = find_release(transport, '0.0.0')
          if previous is None or compare_versions(previous.version, VERSION) >= 0:
              raise RuntimeError('A versão estável anterior precisa ser mais antiga que a candidata.')
          target = Path('validation/previous-native') / previous.name
          target.parent.mkdir(parents=True, exist_ok=True)
          transport.download(previous, target)
          print(target.resolve())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Não consegui verificar o instalador estável anterior.' }
          python scripts/test_windows_native.py --installer "$bolhaPreviousInstaller" --target-installer "release/Bolha-Setup-$($env:BOLHA_VERSION)-x64.exe" --output validation/from-previous-native
          if ($LASTEXITCODE -ne 0) { throw 'A atualização da versão estável anterior falhou.' }
      - uses: actions/setup-node@v4
        if: github.ref_type == 'tag' || inputs.legacy_validation || inputs.publish_release
        with:
          node-version: '22'
      - name: Preparar somente o controlador de teste Electron legado
        if: github.ref_type == 'tag' || inputs.legacy_validation || inputs.publish_release
        run: npm install --prefix validation/legacy-runner --no-audit --no-fund --no-save @playwright/test@1.56.1
      - name: Validar migração real das versões Electron no runner descartável
        if: github.ref_type == 'tag' || inputs.legacy_validation || inputs.publish_release
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation/previous | Out-Null
          $bolhaPrevious = @{
            '0.1.0' = 'f7cbd370555ed81d9bcc3fb949c1a7091e61433299c65c0958ca97cf09dc8599'
            '0.2.1' = '20078a4cda5d563b6ebac461103cf8a2a2f1b26589cb36dea41b26a8243d16a4'
          }
          foreach ($bolhaOld in @('0.1.0','0.2.1')) {
            $bolhaFile = "validation/previous/Bolha-Setup-$bolhaOld-x64.exe"
            Invoke-WebRequest "https://github.com/kuky13/bolha/releases/download/v$bolhaOld/Bolha-Setup-$bolhaOld-x64.exe" -OutFile $bolhaFile
            if ((Get-FileHash $bolhaFile -Algorithm SHA256).Hash.ToLower() -ne $bolhaPrevious[$bolhaOld]) { throw "Checksum inválido: $bolhaOld" }
            python scripts/test_windows_native.py --legacy-installer $bolhaFile --installer "release/Bolha-Setup-$($env:BOLHA_VERSION)-x64.exe" --playwright-root validation/legacy-runner --output "validation/from-$bolhaOld"
            if ($LASTEXITCODE -ne 0) { throw "Migração $bolhaOld falhou." }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolha-windows-${{ github.sha }}
          retention-days: 7
          path: |
            validation/**/*.json
            validation/**/*.png
            release/*.exe
            release/latest.yml
            release/SHA256SUMS.txt
            release/THIRD-PARTY-NOTICES.txt
      - name: Publicar a versão validada
        if: success() && (github.ref_type == 'tag' || inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          BOLHA_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bolhaCodeVersion = python -c "from bolha import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $bolhaCodeVersion -ne $env:BOLHA_VERSION -or $bolhaCodeVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Versão do código divergente.' }
          $bolhaTag = 'v' + $env:BOLHA_VERSION
          $bolhaCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $bolhaCommit -ne $env:GITHUB_SHA) { throw 'O commit compilado diverge do alvo da publicação.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $bolhaTag) { throw 'A tag diverge da versão validada.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:BOLHA_PUBLISH_RELEASE -ne 'true') { throw 'Publicação manual não solicitada.' }
            $bolhaRefsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$bolhaTag"
            if ($LASTEXITCODE -ne 0) { throw 'Não consegui verificar as tags existentes.' }
            $bolhaExistingTag = @($bolhaRefsJson | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/$bolhaTag" })
            if ($bolhaExistingTag.Count -gt 0) { throw 'A tag já existe. Nenhuma tag ou release será sobrescrita.' }
          } else {
            $bolhaRemoteCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/refs/tags/$bolhaTag" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $bolhaRemoteCommit -ne $env:GITHUB_SHA) { throw 'A tag remota não aponta para o commit validado.' }
          }
          $bolhaReleaseTags = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Não consegui verificar as releases existentes.' }
          if ($bolhaReleaseTags -contains $bolhaTag) { throw 'A release já existe. Nenhum arquivo será sobrescrito.' }
          gh release create $bolhaTag release/*.exe release/latest.yml release/SHA256SUMS.txt release/THIRD-PARTY-NOTICES.txt --target $env:GITHUB_SHA --title "Bolha $env:BOLHA_VERSION" --notes-file docs/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'A criação da release falhou; não será feita sobrescrita ou retag.' }
